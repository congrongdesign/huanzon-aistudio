appId: com.huanzon.aistudio
productName: 环中AIStudio
copyright: Copyright © 2026 HuanZon

directories:
  buildResources: electron
  output: release

npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
afterPack: scripts/windows-executable-branding.mjs

files:
  - electron/dist/**/*
  - package.json
  - "!node_modules"
  - "!src"
  - "!public"
  - "!.next"
  - "!.desktop-runtime"

extraResources:
  - from: electron/icon.png
    to: icon.png
  - from: .desktop-runtime/updater
    to: updater
    filter:
      - "**/*"

publish:
  provider: generic
  url: https://github.com/congrongdesign/huanzon-aistudio/releases/latest/download
  channel: latest

win:
  icon: electron/icon.ico
  # Resource branding is verified by afterPack, without requiring Wine on macOS.
  signAndEditExecutable: false
  extraResources:
    - from: electron/icon.ico
      to: icon.ico
    - from: .next/standalone-win
      to: standalone
      filter:
        - "**/*"
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: "AIStudio-${version}-win-${arch}.${ext}"

mac:
  appId: com.huanzon.aistudio
  bundleVersion: "${version}"
  category: public.app-category.graphics-design
  icon: electron/icon.icns
  extendInfo:
    NSAppleEventsUsageDescription: 将字体图片发送到 Adobe Illustrator，自动进行矢量描摹。
    CFBundleDocumentTypes:
      - CFBundleTypeName: 环中AIStudio资源包
        CFBundleTypeExtensions: [hzlib]
        CFBundleTypeIconFile: icon.icns
        # Resource packages are read through the library import preview.
        CFBundleTypeRole: Viewer
        LSHandlerRank: Owner
        LSItemContentTypes: [com.huanzon.aistudio.library]
    UTExportedTypeDeclarations:
      - UTTypeIdentifier: com.huanzon.aistudio.library
        UTTypeDescription: 环中AIStudio资源包
        UTTypeConformsTo: [public.data, public.content]
        UTTypeIconFile: icon.icns
        UTTypeTagSpecification:
          public.filename-extension: [hzlib]
          public.mime-type: application/vnd.huanzon.library+zip
  extraResources:
    - from: .next/standalone
      to: standalone
      filter:
        - "**/*"
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: "AIStudio-${version}-${arch}.${ext}"
  hardenedRuntime: true
  gatekeeperAssess: false

linux:
  icon: electron/icon.png
  extraResources:
    - from: .next/standalone
      to: standalone
      filter:
        - "**/*"
  target:
    - AppImage
  category: Graphics

nsis:
  guid: 7f9f4b4f-5d1f-4c7e-9ef0-9c28437b6d36
  oneClick: false
  perMachine: false
  deleteAppDataOnUninstall: false
  allowToChangeInstallationDirectory: true
  installerIcon: electron/icon.ico
  uninstallerIcon: electron/icon.ico
  installerHeaderIcon: electron/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 环中AIStudio
  artifactName: "AIStudio-${version}-win-${arch}-setup.${ext}"

portable:
  artifactName: "AIStudio-${version}-win-${arch}-portable.${ext}"

asar: true
